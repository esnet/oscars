name: oscars

deploy:
  remote: false
  commands:
    - name: Deploy ocd-stack
      command: |
        helm upgrade ocd-stack oci://wharf.es.net/ocd-helm/ocd-stack \
          --install \
          --set oscars.backend.image.location=${OKTETO_BUILD_OSCARS_BACKEND_IMAGE}

destroy:
  commands:
    - helm uninstall ocd-stack
    - kubectl delete pvc -l app.kubernetes.io/instance=ocd-stack

build:
  oscars-backend:
    context: .
    dockerfile: deploy/devel/backend.dockerfile
  oscars-backend-dev:
    context: .
    dockerfile: deploy/devel/backend.dockerfile
    target: dev

dev:
  oscars-backend:
    image: "${OKTETO_BUILD_OSCARS_BACKEND_DEV_IMAGE}"
    command: ["/usr/local/bin/dev-entrypoint.sh"]
    environment:
      JAVA_OPTS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9201
    forward:
      - 9201:9201
      - 8201:8201
      - 8211:8211
    sync:
      - ./backend/src:/build/backend/src
