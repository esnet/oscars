networks:
  oscars-loadtest-net:
    name: oscars-loadtest-net
    driver: bridge
services:
  oscars-db:
    image: "wharf.es.net/dockerhub-proxy/library/postgres:14.1-alpine"
    container_name:   oscars-nostack-db
    networks:
      - oscars-loadtest-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oscars}
      POSTGRES_USER: ${POSTGRES_USER:-oscars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-oscars} -U ${POSTGRES_USER:-oscars}"]
      interval: 5s
      timeout: 5s
      retries: 5
  oscars-backend:
    container_name: oscars-nostack-profiler-backend
    hostname: oscars-backend
    networks:
      - oscars-loadtest-net
    build:
      context: ./
      args:
        HOSTNAME: ${HOSTNAME}
        JAVA_OPTS: ${JAVA_OPTS}
        MAVEN_OPTS: ${MAVEN_OPTS}
      dockerfile: ./deploy/devel/backend.dockerfile
    depends_on:
      oscars-db:
        condition: service_healthy
    environment:
      # Use the "default" Spring profile (not "test"): SecurityConfig is
      # @Profile("default") only, so under "test" it never registers and
      # Spring Security's blanket auto-config takes over instead, redirecting
      # every request (even /api/**) into an OAuth2 login flow. AUTH_OAUTH_ENABLED
      # disables the OAuth-gated /protected/** rules for load testing purposes,
      # mirroring what testing.properties' auth.oauth-enabled=false does for
      # the Cucumber test suite.
      SPRING_PROFILES_ACTIVE: default
      AUTH_OAUTH_ENABLED: "false"
      HOSTNAME: ${HOSTNAME}
      JAVA_OPTS: ${JAVA_OPTS}
      MAVEN_OPTS: ${MAVEN_OPTS}
      OSCARS_BACKEND_WEB_PORT: ${OSCARS_BACKEND_WEB_PORT:-8201}
      SPRING_DATASOURCE_URL: jdbc:postgresql://oscars-db:5432/${POSTGRES_DB:-oscars}
      POSTGRES_USER: ${POSTGRES_USER:-oscars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-secret}
      ESDB_API_KEY: ${ESDB_API_KEY}
      ESDB_URI: ${ESDB_URI}
      ESDB_GRAPHQL_URI: ${ESDB_GRAPHQL_URI:-http://esdb:8000/esdb_api/graphql}
      TOPO_OSCARS_URL: ${TOPO_OSCARS_URL:-http://topo-oscars:8004/oscars-one/topology}
      NSO_SYNC: "disabled"
      NSO_USERNAME: ${NSO_USERNAME}
      NSO_PASSWORD: ${NSO_PASSWORD}
      NSO_URI: ${NSO_URI}
    ports:
      - "8201:8201"
      - "9201:9201" # Debugger port
      - "1099:1099" # profiler port
    volumes:
      - ./backend/profiling:/app/profiling:rw
    healthcheck:
      test: nc -z localhost 8201 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10

  oscars-load-test:
    depends_on:
      oscars-backend:
        condition: service_healthy
    build:
      context: ./
      args:
        TARGET_HOST: oscars-backend
        FILENAME: load-testing-results.csv
        WEB_REPORT_DIR: load-testing
      dockerfile: ./deploy/devel/load-test.dockerfile
    environment:
      TARGET_HOST: oscars-backend
      FILENAME: load-testing-results.csv
      WEB_REPORT_DIR: load-testing-web
    volumes:
      - ./backend/load-testing:/app/load-testing:rw
    links:
      - "oscars-backend:8201"
    networks:
      - oscars-loadtest-net
